server {
    listen 80;
    server_name _;

    # Корневая директория статического фронтенда (лендинг для тёплых клиентов)
    root /usr/share/nginx/html;
    index index.html;

    # Максимальный размер тела запроса
    client_max_body_size 10M;

    # Внутренний DNS-сервер Docker для динамического резолвинга сервисов
    resolver 127.0.0.11 valid=10s;

    # 1. Раздача фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование запросов к Backend API
    # Используется переменная, чтобы Nginx успешно стартовал, даже пока backend закомментирован
    location /api/ {
        set $backend_upstream http://backend:8000;
        
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 3. Веб-интерфейс pgAdmin для управления базой данных
    location /pgadmin/ {
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        proxy_pass http://pgadmin:80/;
    }

    # 4. Проксирование Docker Registry (порт 80 всегда открыт у всех провайдеров)
    location /v2/ {
        client_max_body_size 0;
        chunked_transfer_encoding on;

        proxy_pass http://registry:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900;
    }

    # Защита от прямого доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }
}
